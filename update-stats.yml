name: Update GitHub Stats

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:         # allows manual "Run workflow" trigger

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p assets

      - name: Fetch GitHub stats card
        run: |
          curl -sL "https://github-readme-stats.vercel.app/api?username=vinod-meghwar&show_icons=true&theme=tokyonight&hide_border=true&count_private=true" -o assets/stats.svg

      - name: Fetch top languages card
        run: |
          curl -sL "https://github-readme-stats.vercel.app/api/top-langs/?username=vinod-meghwar&layout=compact&theme=tokyonight&hide_border=true&langs_count=6" -o assets/top-langs.svg

      - name: Fetch streak stats card
        run: |
          curl -sL "https://streak-stats.demolab.com/?user=vinod-meghwar&theme=tokyonight&hide_border=true" -o assets/streak.svg

      - name: Verify downloaded files are valid SVGs
        run: |
          for f in assets/stats.svg assets/top-langs.svg assets/streak.svg; do
            if ! grep -q "<svg" "$f"; then
              echo "::error::$f did not download correctly (rate limited or bad response). Aborting commit."
              exit 1
            fi
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg assets/streak.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update GitHub stats SVGs" && git push)
